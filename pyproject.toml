[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jevcheck"
version = "0.2.1"
description = "pytest for Jev — pin production behavioral contracts and eval candidate model upgrades"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Nithilan Kumaran" }]
keywords = ["jev", "typesafe", "eval", "contract", "model-upgrade"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2",
    "typesafe-sdk>=0.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jevcheck = "jevcheck.cli:main"

[project.urls]
Homepage = "https://github.com/sathariels/jevcheck"
Source = "https://github.com/sathariels/jevcheck"
Documentation = "https://github.com/sathariels/jevcheck"
Issues = "https://github.com/sathariels/jevcheck/issues"
Changelog = "https://github.com/sathariels/jevcheck/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jevcheck = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "."]
